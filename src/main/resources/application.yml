spring:
  application:
    name: warehouse-monitoring
  artemis:
    mode: embedded
  jms:
    template:
      default-destination: sensor.measurements

warehouses:
  - id: warehouse-1
    sensors:
      - type: temperature
        port: 3344
      - type: humidity
        port: 3355
  - id: warehouse-2
    sensors:
      - type: temperature
        port: 4344
      - type: humidity
        port: 4355

monitoring:
  thresholds:
    temperature: 35
    humidity: 50

logging:
  level:
    root: INFO
    com.warehouse.monitoring: INFO
    org.apache.activemq.audit: WARN
    org.apache.activemq.artemis: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
